<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مجموعة وقري عينًا</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
background:#f5efe5;
color:#665139;
font-family:Tahoma,Arial,sans-serif;
margin:0;
line-height:1.9;
}
header{
background:#e6d7bd;
padding:35px 15px;
text-align:center;
}
h1{color:#896b39;font-size:30px}
main{
max-width:700px;
margin:auto;
padding:20px;
}
.card{
background:#fffdf8;
border:1px solid #d8c5a4;
border-radius:18px;
padding:24px;
margin-bottom:20px;
}
input,button{
font-family:inherit;
font-size:16px;
}
input[type=text]{
width:100%;
padding:15px;
border:1px solid #d8c5a4;
border-radius:10px;
margin:12px 0;
}
button{
width:100%;
background:#967b4e;
color:white;
border:0;
border-radius:10px;
padding:15px;
margin:10px 0;
cursor:pointer;
}
button:disabled{opacity:.5}
.option{
display:flex;
align-items:center;
gap:10px;
background:#f5efe5;
padding:13px;
border:1px solid #d8c5a4;
border-radius:10px;
margin:10px 0;
cursor:pointer;
}
.option:has(input:checked){
background:#e6d7bd;
border-color:#896b39;
}
input[type=radio]{
accent-color:#967b4e;
width:20px;
height:20px;
flex-shrink:0;
}
#timer{
position:sticky;
top:0;
z-index:10;
background:#896b39;
color:white;
padding:12px;
text-align:center;
border-radius:10px;
font-size:22px;
margin-bottom:20px;
}
#grade{
font-size:42px;
color:#896b39;
font-weight:bold;
}
footer{
text-align:center;
padding:25px;
color:#8b7961;
}
[hidden]{display:none!important}
#status{
white-space:pre-wrap;
}
</style>
</head>
<body>

<header>
  
<img
  src="5bd0d512-2e49-429d-b8aa-c482f13c0da9.jpeg"
  alt="شعار مركز عباد الرحمن"
  style="
    width:120px;
    height:120px;
    object-fit:contain;
    border-radius:50%;
    border:2px solid #b49a65;
    background:white;
    box-shadow:0 4px 15px #00000015;
    margin-bottom:10px;
  ">

<p style="font-size:25px">﷽</p>
<h1>مجموعة وقري عينًا</h1>
<p>منصة الاختبارات الشرعية والقرآنية</p>
</header>

<main>

<section id="home" class="card">
<h2>أهلًا وسهلًا بكِ</h2>
<p>نسأل الله لكِ التوفيق والسداد</p>
<h3>الاختبارات المتاحة</h3>
<div id="examList">جارٍ تحميل الاختبارات...</div>
<button onclick="loadExams()">تحديث الاختبارات</button>
</section>

<section id="registration" class="card" hidden>
<h2 id="examTitle"></h2>
<p id="examDescription"></p>
<p id="examDuration"></p>

<label for="studentName">اسم الطالبة الكامل</label>
<input type="text" id="studentName"
maxlength="150"
placeholder="اكتبي اسمكِ الكامل">

<label for="accessCode">رمز الدخول الخاص بكِ</label>
<input type="text" id="accessCode"
dir="ltr"
autocomplete="off"
autocapitalize="characters"
spellcheck="false"
placeholder="رمز الدخول">

<p>تنبيه: رمز الدخول صالح لمحاولة واحدة فقط. لا تغلقي الصفحة أثناء الاختبار.</p>

<button id="startButton" onclick="startExam()">
ابدئي الاختبار
</button>
<button id="backButton" onclick="goHome()">العودة</button>
</section>

<section id="examPage" hidden>
<div id="timer">00:00</div>
<div class="card">
<h2 id="currentTitle"></h2>
<p id="studentLabel"></p>
<p id="progress"></p>
</div>
<div id="questions"></div>
<button id="submitButton" onclick="submitExam(false)">
تسليم الاختبار
</button>
</section>

<section id="resultPage" class="card" hidden style="text-align:center">
<h2>نتيجة الاختبار</h2>
<p id="resultName"></p>
<div id="grade"></div>
<p id="percentage"></p>
<p id="resultMessage"></p>
<p>تم حفظ نتيجتكِ بنجاح</p>
<button onclick="location.reload()">
العودة إلى الصفحة الرئيسية
</button>
</section>

<p id="status" role="status"></p>
</main>

<footer>
مجموعة وقري عينًا © 2026
</footer>

<script>
const db = window.supabase.createClient(
"https://hadkrvkqmmpimqnrboym.supabase.co",
"sb_publishable__HrFXlj95XyTSlONB_Akzw_v62Sy2wl"
);

const el = id => document.getElementById(id);

let selectedExam = null;
let questions = [];
let answers = {};
let studentName = "";
let accessCode = "";
let timerInterval = null;
let deadline = 0;
let submitting = false;
let finished = false;
let expired = false;
let starting = false;

function status(message){
el("status").textContent = message;
}

function show(page){
["home","registration","examPage","resultPage"]
.forEach(id => el(id).hidden = id !== page);
}

async function loadExams(){
status("");

const {data,error} = await db.from("exams")
.select("id,title,description,duration_minutes")
.eq("is_active",true);

if(error){
el("examList").textContent =
"تعذر تحميل الاختبارات";
status(error.message);
return;
}

const list = el("examList");
list.replaceChildren();

if(!data.length){
list.textContent =
"لا توجد اختبارات متاحة حاليًا";
return;
}

data.forEach(exam => {
const box = document.createElement("div");
box.className = "card";

const title = document.createElement("h3");
title.textContent = exam.title;
box.appendChild(title);

const desc = document.createElement("p");
desc.textContent = exam.description || "";
box.appendChild(desc);

const duration = document.createElement("p");
duration.textContent =
"مدة الاختبار: " +
exam.duration_minutes + " دقيقة";
box.appendChild(duration);

const button = document.createElement("button");
button.textContent = "الدخول إلى الاختبار";
button.onclick = () => selectExam(exam);
box.appendChild(button);

list.appendChild(box);
});
}

function selectExam(exam){
selectedExam = exam;
el("examTitle").textContent = exam.title;
el("examDescription").textContent =
exam.description || "";
el("examDuration").textContent =
"مدة الاختبار: " +
exam.duration_minutes + " دقيقة";
el("accessCode").value = "";
status("");
show("registration");
window.scrollTo(0,0);
}

function goHome(){
if(starting) return;
show("home");
status("");
loadExams();
}

async function startExam(){
if(starting || !selectedExam) return;

studentName = el("studentName").value.trim();
accessCode = el("accessCode").value
.trim().toUpperCase();

if(!studentName){
status("يرجى كتابة اسم الطالبة");
return;
}

if(!accessCode){
status("يرجى إدخال رمز الدخول الخاص بكِ");
return;
}

starting = true;
el("startButton").disabled = true;
el("backButton").disabled = true;
el("studentName").disabled = true;
el("accessCode").disabled = true;

status("جارٍ التحقق من الاختبار ورمز الدخول...");

try{



const {data,error} = await db.rpc("start_exam",{
p_exam_id:selectedExam.id,
p_student_name:studentName,
p_code:accessCode
});

if(error) throw error;

deadline = new Date(data.expires_at).getTime();

if(!Number.isFinite(deadline)){
throw new Error("تعذر تحديد وقت الاختبار");
}
questions = data.questions;
answers = {};
finished = false;
expired = false;

el("currentTitle").textContent =
selectedExam.title;

el("studentLabel").textContent =
"الطالبة: " + studentName;

el("timer").style.background = "#896b39";

renderQuestions();
updateProgress();

show("examPage");
status("");
window.scrollTo(0,0);

clearInterval(timerInterval);
timerInterval = setInterval(updateTimer,1000);
updateTimer();

}catch(error){
status(error.message || "تعذر بدء الاختبار");
}finally{
starting = false;
el("startButton").disabled = false;
el("backButton").disabled = false;
el("studentName").disabled = false;
el("accessCode").disabled = false;
}
}

function renderQuestions(){
const list = el("questions");
list.replaceChildren();

questions.forEach((q,i)=>{
const box = document.createElement("div");
box.className = "card";

const title = document.createElement("h3");
title.textContent = (i+1)+". "+q.question;
box.appendChild(title);

q.options.forEach((option,j)=>{
const label = document.createElement("label");
label.className = "option";

const radio = document.createElement("input");
radio.type = "radio";
radio.name = "question_"+q.id;
radio.value = j;

radio.onchange = ()=>{
if(expired || finished || submitting) return;

if(Date.now() >= deadline){
updateTimer();
return;
}

answers[q.id] = j;
updateProgress();
};

const text = document.createElement("span");
text.textContent = option;

label.appendChild(radio);
label.appendChild(text);
box.appendChild(label);
});

list.appendChild(box);
});
}

function updateProgress(){
el("progress").textContent =
"تمت الإجابة عن "+
Object.keys(answers).length+
" من "+questions.length+" سؤال";
}

function lockAnswers(locked){
document.querySelectorAll("#questions input")
.forEach(input => input.disabled = locked);
}

function updateTimer(){
if(finished) return;

const remaining = Math.max(
0,Math.ceil((deadline-Date.now())/1000)
);

const minutes = Math.floor(remaining/60);
const seconds = remaining%60;

el("timer").textContent =
"الوقت المتبقي: "+
String(minutes).padStart(2,"0")+":"+
String(seconds).padStart(2,"0");

if(remaining <= 60){
el("timer").style.background = "#a34d40";
}

if(remaining === 0){
clearInterval(timerInterval);
expired = true;
lockAnswers(true);
submitExam(true);
}
}

async function submitExam(automatic){
if(submitting || finished) return;

if(Date.now() >= deadline){
expired = true;
lockAnswers(true);
clearInterval(timerInterval);
}

if(!automatic && !expired){
if(!confirm("هل أنتِ متأكدة من تسليم الاختبار؟"))
return;
}

submitting = true;
lockAnswers(true);
el("submitButton").disabled = true;

status("جارٍ تصحيح الاختبار وحفظ النتيجة...");

try{

const {data,error} = await db.rpc(
"submit_exam_with_code",{
p_exam_id:selectedExam.id,
p_code:accessCode,
p_answers:answers
});

if(error) throw error;

finished = true;
clearInterval(timerInterval);

const score = Number(data.score);
const total = Number(data.total);
const percent = Math.round(score/total*100);

el("resultName").textContent = studentName;
el("grade").textContent = score+" / "+total;

el("percentage").textContent =
"النسبة المئوية: "+percent+"%";

el("resultMessage").textContent =
percent >= 90 ? "ممتاز، بارك الله فيكِ" :
percent >= 75 ? "أحسنتِ، زادكِ الله علمًا" :
percent >= 50 ? "وفقكِ الله وزادكِ علمًا" :
"واصلي المراجعة، وفقكِ الله";

accessCode = "";
el("accessCode").value = "";

status("");
show("resultPage");
window.scrollTo(0,0);

}catch(error){
status("تعذر تأكيد حفظ النتيجة: "+error.message);
el("submitButton").textContent =
"إعادة محاولة التسليم";
}finally{
submitting = false;
el("submitButton").disabled = finished;
if(!finished && !expired) lockAnswers(false);
}
}

window.addEventListener("beforeunload",event=>{
if(!el("examPage").hidden && !finished){
event.preventDefault();
event.returnValue = "";
}
});

loadExams();
</script>
  
<script>
(()=>{
let pendingSave=Promise.resolve();

const originalRpc=db.rpc.bind(db);

db.rpc=async function(name,params,options){

const response=await originalRpc(
name,params,options
);

if(name==="start_exam" &&
!response.error && response.data){

restoredAnswers=
response.data.saved_answers||{};

serverOffset=
new Date(response.data.server_now).getTime()
-Date.now();

}

return response;
};

let restoredAnswers={};
let serverOffset=0;

const originalRender=renderQuestions;

renderQuestions=function(){

answers={...restoredAnswers};

originalRender();

document.querySelectorAll(
"#questions input[type=radio]"
).forEach(radio=>{

const questionId=
radio.name.replace("question_","");

radio.checked=
answers[questionId]===Number(radio.value);

radio.onchange=()=>{

if(expired||finished||submitting)return;

if(Date.now()+serverOffset>=deadline){
updateTimer();
return;
}

answers[questionId]=Number(radio.value);

updateProgress();

const examId=selectedExam.id;
const code=accessCode;
const name=studentName;

const changedAnswer={
[questionId]:Number(radio.value)
};

status("جارٍ حفظ الإجابة...");

pendingSave=pendingSave.then(async()=>{

const {error}=await db.rpc(
"save_exam_answers",{
p_exam_id:examId,
p_code:code,
p_student_name:name,
p_answers:changedAnswer
});

if(error)throw error;

status("تم حفظ الإجابة تلقائيًا ✓");

}).catch(error=>{
status("تعذر حفظ الإجابة: "+
error.message);
});

};

});

};

updateTimer=function(){

if(finished)return;

const remaining=Math.max(
0,Math.ceil(
(deadline-Date.now()-serverOffset)/1000
)
);

const minutes=Math.floor(remaining/60);
const seconds=remaining%60;

el("timer").textContent=
"الوقت المتبقي: "+
String(minutes).padStart(2,"0")+":"+
String(seconds).padStart(2,"0");

if(remaining<=60){
el("timer").style.background="#a34d40";
}

if(remaining===0){
clearInterval(timerInterval);
expired=true;
lockAnswers(true);
submitExam(true);
}

};

const originalSubmit=submitExam;

submitExam=async function(automatic){

if(submitting||finished)return;

await pendingSave;

await originalSubmit(automatic);

};

const notice=el("registration")
.querySelector("p:last-of-type");

if(notice){
notice.textContent=
"رمز الدخول صالح لمحاولة واحدة. "+
"يمكنكِ استئناف الاختبار بالاسم والرمز نفسيهما "+
"قبل انتهاء الوقت، دون الحصول على وقت إضافي. "+
"تُحفظ الإجابات تلقائيًا عند توفر الإنترنت.";
}

el("startButton").textContent=
"بدء أو استئناف الاختبار";

})();
</script>
<style>
.blank-input{
display:inline-block;
width:160px!important;
max-width:100%;
padding:10px!important;
margin:5px!important;
text-align:center;
background:#fff;
border:1px solid #b49a72!important;
border-radius:8px;
color:#665139;
}
.fill-question{
font-size:20px;
line-height:2.6;
overflow-wrap:anywhere;
}
.question-kind{
font-size:13px;
color:#896b39;
}
</style>

<script>
(()=>{
let restored={};
let offset=0;
let saveQueue=Promise.resolve();
let waitingToSubmit=false;

const previousRpc=db.rpc.bind(db);

db.rpc=async function(name,params,options){

const response=await previousRpc(
name,params,options
);

if(name==="start_exam" &&
!response.error && response.data){

restored=response.data.saved_answers||{};

offset=new Date(
response.data.server_now
).getTime()-Date.now();

}

return response;
};

function saveAnswer(questionId,value){

const examId=selectedExam.id;
const code=accessCode;
const name=studentName;

const changed={
[questionId]:Array.isArray(value)
?[...value]:value
};

status("جارٍ حفظ الإجابة...");

saveQueue=saveQueue.then(async()=>{

const {error}=await db.rpc(
"save_exam_answers",{
p_exam_id:examId,
p_code:code,
p_student_name:name,
p_answers:changed
});

if(error)throw error;

status("تم حفظ الإجابة تلقائيًا ✓");

}).catch(error=>{

status("تعذر حفظ الإجابة: "+
error.message);

});

}

function canAnswer(){

if(expired||finished||
submitting||waitingToSubmit){
return false;
}

if(Date.now()+offset>=deadline){
updateTimer();
return false;
}

return true;
}

renderQuestions=function(){

answers={...restored};

const list=el("questions");
list.replaceChildren();

questions.forEach((q,i)=>{

const box=document.createElement("div");
box.className="card";

const kind=document.createElement("p");
kind.className="question-kind";

const title=document.createElement("h3");

if(q.question_type==="fill_blank"){

const parts=q.question.split("[blank]");
const count=parts.length-1;

kind.textContent=
"ملء الفراغات — "+count+" درجة";

title.textContent="السؤال "+(i+1);

box.append(kind,title);

const line=document.createElement("div");
line.className="fill-question";

const values=Array.from(
{length:count},(_,j)=>
Array.isArray(answers[q.id])
?String(answers[q.id][j]??"")
:""
);

parts.forEach((part,j)=>{

line.appendChild(
document.createTextNode(part)
);

if(j<count){

const input=document.createElement("input");

input.type="text";
input.className="blank-input";
input.placeholder="الفراغ "+(j+1);
input.setAttribute(
"aria-label","الفراغ "+(j+1)
);
input.autocomplete="off";
input.spellcheck=false;
input.maxLength=10000;
input.value=values[j];

input.oninput=()=>{

if(!canAnswer())return;

values[j]=input.value;

answers[q.id]=[...values];

updateProgress();

saveAnswer(q.id,values);

};

line.appendChild(input);

}

});

box.appendChild(line);

}else{

kind.textContent=
"اختيار من متعدد — درجة واحدة";

title.textContent=(i+1)+". "+q.question;

box.append(kind,title);

(q.options||[]).forEach((option,j)=>{

const label=document.createElement("label");
label.className="option";

const radio=document.createElement("input");

radio.type="radio";
radio.name="question_"+q.id;
radio.value=j;
radio.checked=answers[q.id]===j;

radio.onchange=()=>{

if(!canAnswer())return;

answers[q.id]=j;

updateProgress();

saveAnswer(q.id,j);

};

const text=document.createElement("span");
text.textContent=option;

label.append(radio,text);
box.appendChild(label);

});

}

list.appendChild(box);

});

};

updateProgress=function(){

let completed=0;
let total=0;

questions.forEach(q=>{

if(q.question_type==="fill_blank"){

const count=(
q.question.match(/\[blank\]/g)||[]
).length;

total+=count;

const values=answers[q.id];

if(Array.isArray(values)){

completed+=values.slice(0,count)
.filter(v=>
typeof v==="string"&&v.trim()!==""
).length;

}

}else{

total++;

if(Number.isInteger(answers[q.id])){
completed++;
}

}

});

el("progress").textContent=
"تمت الإجابة عن "+completed+
" من "+total+" خانة إجابة";

};

const previousSubmit=submitExam;

submitExam=async function(automatic){

if(submitting||finished||
waitingToSubmit)return;

waitingToSubmit=true;

lockAnswers(true);
el("submitButton").disabled=true;

try{

await saveQueue;

await previousSubmit(automatic);

}finally{

waitingToSubmit=false;

el("submitButton").disabled=finished;

if(!finished&&!expired){
lockAnswers(false);
}

}

};

})();
</script>
  
<!-- مقدمة مركز عباد الرحمن -->

  <img
    src="5bd0d512-2e49-429d-b8aa-c482f13c0da9.jpeg"
    alt="مركز عباد الرحمن">
</div>

<style>
#centerIntro {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100dvh;
  background: #fffdf7;
  z-index: 999999;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  animation: introExit 1s ease 5s forwards;
}

#centerIntro img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  animation: introAppear 2s ease forwards;
}

@keyframes introAppear {
  from {
    opacity: 0;
    transform: scale(0.85);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes introExit {
  to {
    opacity: 0;
    visibility: hidden;
  }
}
</style>

<script>

  const intro = document.getElementById("centerIntro");
