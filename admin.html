<script>
const db = window.supabase.createClient(
"https://hadkrvkqmmpimqnrboym.supabase.co",
"sb_publishable__HrFXlj95XyTSlONB_Akzw_v62Sy2wl"
);

const el = id => document.getElementById(id);

function status(message){
el("status").textContent=message;
}

async function signIn(){
status("جارٍ تسجيل الدخول...");
const {data,error}=await db.auth.signInWithPassword({
email:el("email").value.trim(),
password:el("password").value
});
if(error){
status("تعذر تسجيل الدخول: "+error.message);
return;
}
el("password").value="";
await checkAdmin(data.user);
}

async function checkAdmin(user){
if(!user)return;
const {data,error}=await db.from("admins")
.select("user_id")
.eq("user_id",user.id)
.maybeSingle();

if(error||!data){
await db.auth.signOut();
status("تعذر التحقق من صلاحية المشرفة.");
return;
}
el("login").hidden=true;
el("dashboard").hidden=false;
status("");
await loadExams();
await loadResults();
}

async function signOut(){
await db.auth.signOut();
location.reload();
}

async function createExam(){
const title=el("title").value.trim();
const duration=Number(el("duration").value);

if(!title||!Number.isInteger(duration)||duration<1){
status("أدخلي اسم الاختبار ومدة صحيحة.");
return;
}

el("create").disabled=true;

const {error}=await db.from("exams").insert({
title:title,
description:el("description").value,
duration_minutes:duration,
is_active:false
});

el("create").disabled=false;

if(error){
status(error.message);
return;
}

el("title").value="";
el("description").value="";
status("تم حفظ الاختبار بنجاح");
await loadExams();
}

async function loadExams(){
const {data,error}=await db.from("exams")
.select("*")
.order("created_at",{ascending:false});

if(error){
status(error.message);
return;
}
el("statExams").textContent = data.length;
el("statPublished").textContent = data.filter(exam => exam.is_active === true).length;
const list=el("exams");
list.replaceChildren();

if(!data.length){
list.textContent="لا توجد اختبارات بعد";
return;
}

for(const exam of data){
const box=document.createElement("div");
box.className="card";

const heading=document.createElement("h3");
heading.textContent=exam.title;
box.appendChild(heading);

const info=document.createElement("p");
info.textContent="المدة: "+exam.duration_minutes+" دقيقة — "+(exam.is_active?"مفتوح":"مغلق");
box.appendChild(info);

const toggle=document.createElement("button");
toggle.textContent=exam.is_active?"إغلاق الاختبار":"فتح الاختبار";
toggle.onclick=async()=>{
const {error}=await db.from("exams")
.update({is_active:!exam.is_active})
.eq("id",exam.id);
if(error)status(error.message);
else await loadExams();
};
box.appendChild(toggle);

const remove=document.createElement("button");
remove.textContent="حذف الاختبار";
remove.onclick=async()=>{
if(!confirm("هل أنتِ متأكدة من حذف الاختبار؟"))return;
const {error}=await db.from("exams")
.delete().eq("id",exam.id);
if(error)status(error.message);
else await loadExams();
};
box.appendChild(remove);
list.appendChild(box);
}
}

db.auth.getUser().then(({data})=>{
if(data.user)checkAdmin(data.user);
});
</script>
 <script>
const oldLoadExams = loadExams;

loadExams = async function(){
  await oldLoadExams();

  const {data,error} = await db
    .from("exams")
    .select("id,title,is_active")
    .order("created_at",{ascending:false});

  if(error){
    status(error.message);
    return;
  }

  const cards = el("exams").children;

  data.forEach((exam,i)=>{
    if(!cards[i]) return;

    const btn = document.createElement("button");
    btn.textContent = "إدارة الأسئلة";
    btn.onclick = ()=>manageQuestions(exam);
    cards[i].appendChild(btn);
  });
};

const panel = document.createElement("div");
panel.className = "card";
  panel.id = "adminQuestions";
panel.hidden = true;
panel.innerHTML = `
<h2 id="questionExamTitle"></h2>
<h3>إضافة سؤال جديد</h3>

<textarea id="questionText"
placeholder="اكتبي نص السؤال"></textarea>

<input id="option0" placeholder="الاختيار الأول">
<input id="option1" placeholder="الاختيار الثاني">
<input id="option2" placeholder="الاختيار الثالث">
<input id="option3" placeholder="الاختيار الرابع">

<label>الإجابة الصحيحة</label>

<select id="correctAnswer"
style="width:100%;padding:13px;
font-size:16px;border-radius:10px;
border:1px solid #d8c5a4;
background:white">
<option value="">اختاري الإجابة الصحيحة</option>
<option value="0">الاختيار الأول</option>
<option value="1">الاختيار الثاني</option>
<option value="2">الاختيار الثالث</option>
<option value="3">الاختيار الرابع</option>
</select>

<button id="saveQuestion"
onclick="saveQuestion()">حفظ السؤال</button>

<p id="questionStatus"></p>

<h3>الأسئلة الموجودة</h3>
<div id="questionList"></div>

<button onclick="panel.hidden=true">
إغلاق إدارة الأسئلة
</button>
`;

el("dashboard").appendChild(panel);

let selectedExam = null;

async function manageQuestions(exam){
  selectedExam = exam;
  panel.hidden = false;

  el("questionExamTitle").textContent =
    exam.title;

  el("saveQuestion").disabled =
    exam.is_active;

  el("questionStatus").textContent =
    exam.is_active
    ? "أغلقي الاختبار قبل إضافة الأسئلة"
    : "";

  await loadQuestions();

  panel.scrollIntoView({
    behavior:"smooth"
  });
}

async function saveQuestion(){
  if(!selectedExam) return;

  const question =
    el("questionText").value.trim();

  const options = [0,1,2,3].map(i=>
    el("option"+i).value.trim()
  );

  const correct =
    el("correctAnswer").value;

  if(!question ||
     options.some(x=>!x) ||
     correct===""){
    el("questionStatus").textContent =
      "أكملي السؤال والاختيارات والإجابة الصحيحة";
    return;
  }

  el("saveQuestion").disabled = true;

  const {error} = await db.rpc(
    "save_exam_question",{
      p_exam_id:selectedExam.id,
      p_question:question,
      p_options:options,
      p_correct_answer:Number(correct)
    }
  );

  el("saveQuestion").disabled = false;

  if(error){
    el("questionStatus").textContent =
      error.message;
    return;
  }

  el("questionText").value = "";

  [0,1,2,3].forEach(i=>{
    el("option"+i).value = "";
  });

  el("correctAnswer").value = "";

  el("questionStatus").textContent =
    "تم حفظ السؤال بنجاح ✓";

  await loadQuestions();
}

async function loadQuestions(){
  const {data,error} = await db
    .from("questions")
    .select("id,question,options,position")
    .eq("exam_id",selectedExam.id)
    .order("position");

  const list = el("questionList");
  list.replaceChildren();

  if(error){
    list.textContent = error.message;
    return;
  }

  if(!data.length){
    list.textContent = "لا توجد أسئلة بعد";
    return;
  }

  data.forEach((q,i)=>{
    const box = document.createElement("div");
    box.className = "card";

    const heading = document.createElement("h3");
    heading.textContent =
      (i+1)+". "+q.question;

    box.appendChild(heading);

    q.options.forEach((option,j)=>{
      const p = document.createElement("p");
      p.textContent =
        ["أ","ب","ج","د"][j]+". "+option;
      box.appendChild(p);
    });

    list.appendChild(box);
  });
}
</script>
 
<script>
const resultsPanel = document.createElement("div");
resultsPanel.className = "card";

resultsPanel.innerHTML = `
<h2>سجل نتائج الطالبات</h2>

<label>اختاري الاختبار</label>

<select id="resultsExam"
style="width:100%;padding:13px;
border:1px solid #d8c5a4;
border-radius:10px;
font-size:16px;background:white">
<option value="">جميع الاختبارات</option>
</select>

<button onclick="loadResults()">
عرض وتحديث النتائج
</button>

<button onclick="downloadResults()">
تنزيل النتائج Excel (CSV)
</button>

<p id="resultsCount"></p>
<div id="resultsList"></div>
`;

el("dashboard").appendChild(resultsPanel);

let savedResults = [];

async function loadResults(){
  const list = el("resultsList");
  const select = el("resultsExam");
  const selected = select.value;

  savedResults = [];
  el("resultsCount").textContent = "";
  list.textContent = "جارٍ تحميل النتائج...";

  const {data:exams,error:examError} =
    await db.from("exams")
    .select("id,title")
    .order("created_at",{ascending:false});

  if(examError){
    list.textContent = examError.message;
    return;
  }

  select.replaceChildren(
    new Option("جميع الاختبارات","")
  );

  exams.forEach(exam=>{
    select.add(new Option(exam.title,exam.id));
  });

  select.value = selected;

  if(select.selectedIndex < 0){
    select.value = "";
  }

  let rows = [];
  let offset = 0;

  while(true){
    let query = db.from("results")
      .select("id,exam_id,student_name,score,total_questions,submitted_at")
      .order("submitted_at",{ascending:false})
      .order("id")
      .range(offset,offset+499);

    if(select.value){
      query = query.eq("exam_id",select.value);
    }

    const {data,error} = await query;

    if(error){
      list.textContent = error.message;
      return;
    }

    rows.push(...data);

    if(data.length < 500) break;
    offset += 500;
  }

  const names = new Map(
    exams.map(e=>[e.id,e.title])
  );

  savedResults = rows.map(r=>({
    ...r,
    examTitle:names.get(r.exam_id)
      || "اختبار غير متاح",
    percentage:r.total_questions
      ? Math.round(r.score/r.total_questions*100)
      : 0
  }));
if (!select.value) {
  el("statStudents").textContent = savedResults.length;

  el("statAverage").textContent = savedResults.length
    ? Math.round(savedResults.reduce((sum, r) => sum + r.percentage, 0) / savedResults.length) + "%"
    : "—";
}
  list.replaceChildren();

  el("resultsCount").textContent =
    "عدد المشاركات: "+savedResults.length;

  if(!savedResults.length){
    list.textContent = "لا توجد نتائج بعد";
    return;
  }

  savedResults.forEach((r,i)=>{
    const box = document.createElement("div");
    box.className = "card";

    const h = document.createElement("h3");
    h.textContent = (i+1)+". "+r.student_name;
    box.appendChild(h);

    const details = [
      "الاختبار: "+r.examTitle,
      "الدرجة: "+r.score+" / "+r.total_questions,
      "النسبة: "+r.percentage+"%",
      "التاريخ: "+new Date(r.submitted_at)
        .toLocaleString("ar")
    ];

    details.forEach(value=>{
      const p = document.createElement("p");
      p.textContent = value;
      box.appendChild(p);
    });
const detailsButton = document.createElement("button");

detailsButton.type = "button";

detailsButton.textContent = "عرض تفاصيل الإجابات";

detailsButton.style.background = "#b49a72";

detailsButton.onclick = () => {
  showResultDetails(r.id, box);
};

box.appendChild(detailsButton);
    list.appendChild(box);
  });
}

function downloadResults(){
  if(!savedResults.length){
    alert("اعرضي النتائج أولاً");
    return;
  }

  const escapeCSV = value=>{
    let s = String(value ?? "");
    if(/^[\s]*[=+\-@]/.test(s)
       || /^[\t\r\n]/.test(s)){
      s = "'"+s;
    }
    return '"'+s.replace(/"/g,'""')+'"';
  };

  const rows = [
 ["اسم الطالبة","الاختبار","الدرجة","الدرجة الكلية","النسبة","التاريخ"],
    ...savedResults.map(r=>[
      r.student_name,
      r.examTitle,
      r.score,
      r.total_questions,
      r.percentage+"%",
      new Date(r.submitted_at)
        .toLocaleString("ar")
    ])
  ];

  const csv = "\uFEFF"+rows.map(row=>
    row.map(escapeCSV).join(",")
  ).join("\r\n");

  const blob = new Blob([csv],{
    type:"text/csv;charset=utf-8;"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "نتائج-وقري-عينا.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

el("resultsExam").addEventListener("change",()=>{
  savedResults = [];
  el("resultsCount").textContent = "";
  el("resultsList").textContent =
    "اضغطي على عرض وتحديث النتائج";
});
</script>

<script>
(()=>{

<label>مدة الاختبار بالدقائق</label>
<input id="editExamDuration"

<button id="saveExamChanges">

</button>

<button id="cancelExamChanges">
إلغاء التعديل
</button>

<p id="editExamStatus"></p>
`;

el("dashboard").appendChild(editPanel);

let editingExamId=null;

function openEditExam(exam){
if(exam.is_active){
alert("أغلقي الاختبار أولاً قبل تعديله");
return;
}

editingExamId=exam.id;

el("editExamTitle").value=exam.title;
el("editExamDescription").value=
exam.description||"";

el("editExamDuration").value=
exam.duration_minutes;

});

editingExamId=null;

el("saveExamChanges").onclick=async()=>{

const title=
el("editExamTitle").value.trim();

const description=
el("editExamDescription").value.trim();

const duration=
Number(el("editExamDuration").value);

if(!editingExamId)return;

if(!title||
!Number.isInteger(duration)||
duration<1){

el("editExamStatus").textContent=
"أدخلي اسم الاختبار ومدة صحيحة";
return;
}

button.disabled=true;

.from("exams")
.update({
title:title,
description:description,
duration_minutes:duration
})
.eq("id",editingExamId)
.eq("is_active",false)
.select("id")
.maybeSingle();

<script>
(()=>{
const typeBox=document.createElement("div");

typeBox.innerHTML=`
<label>نوع السؤال</label>
<select id="questionType"
style="width:100%;padding:13px;
font-size:16px;border-radius:10px;
border:1px solid #d8c5a4;
background:white;margin:8px 0">
<option value="multiple_choice">

<option value="fill_blank">
ملء الفراغات
</option>
</select>
`;

el("questionText").before(typeBox);

const blankBox=document.createElement("div");
blankBox.hidden=true;

blankBox.innerHTML=`
<p>
ضعي الرمز [blank] في مكان كل فراغ
داخل نص السؤال.
</p>

<button id="insertBlank" type="button">
+ إضافة فراغ
</button>

<p id="blankCount"></p>
<div id="blankAnswers"></div>
`;

el("questionText").after(blankBox);

const choiceFields=[
el("option0"),
el("option1"),
el("option2"),
el("option3"),
el("correctAnswer"),
el("correctAnswer").previousElementSibling
];

function updateBlanks(){

const count=(
el("questionText").value
.match(/\[blank\]/g)||[]
).length;

const container=el("blankAnswers");

el("blankCount").textContent=
"عدد الفراغات: "+count;

while(container.children.length>count){
container.lastElementChild.remove();
}

while(container.children.length<
Math.min(count,50)){

const input=document.createElement("input");

input.placeholder=
"الإجابة الصحيحة للفراغ "+
(container.children.length+1);

container.appendChild(input);
}

function changeType(){

const fill=
el("questionType").value==="fill_blank";

choiceFields.forEach(field=>{
if(field)field.hidden=fill;
});

blankBox.hidden=!fill;

el("questionText").placeholder=fill
?"مثال: إن مع العسر [blank]"
:"اكتبي نص السؤال";

if(fill)updateBlanks();
}

el("questionType").onchange=changeType;

el("questionText").addEventListener(
"input",updateBlanks
);

el("insertBlank").onclick=()=>{

const field=el("questionText");
const start=field.selectionStart;
const end=field.selectionEnd;

field.setRangeText(
" [blank] ",start,end,"end"
);

updateBlanks();
field.focus();

const originalSaveQuestion=saveQuestion;

saveQuestion=async function(){

if(el("questionType").value
!=="fill_blank"){

if(!selectedExam)return;

el("questionStatus").textContent=

el("questionText").value.trim();

question.match(/\[blank\]/g)||[]
).length;

const answers=Array.from(
el("blankAnswers").children
).map(input=>input.value.trim());

if(!question||
count<1||
count>50||
answers.length!==count||
answers.some(x=>!x)){

el("questionStatus").textContent=
"أكملي نص السؤال والإجابات الصحيحة لكل فراغ";
return;
}

const button=el("saveQuestion");

try{

"save_fill_blank_question",{

p_question:question,
p_correct_answers:answers
});

if(error)throw error;

el("questionText").value="";
updateBlanks();

el("questionStatus").textContent=

}catch(error){

!selectedExam||selectedExam.is_active;

manageQuestions;

type.textContent=

 <script>
async function showResultDetails(resultId, box){

  const existing = box.querySelector(".result-details");

  if(existing){
    existing.remove();
    return;
  }

  const panel = document.createElement("div");
  panel.className = "result-details";
  panel.style.marginTop = "15px";
  panel.style.padding = "12px";
  panel.style.border = "1px solid #d8c5a4";
  panel.style.borderRadius = "12px";
  panel.style.background = "#faf7ef";

  box.appendChild(panel);

  panel.textContent = "جارٍ تحميل تفاصيل الإجابات...";

  function addText(parent, value, color){
    const p = document.createElement("p");
    p.textContent = value;
    if(color) p.style.color = color;
    parent.appendChild(p);
    return p;
  }

  function normalizeAnswer(value){
    return String(value ?? "")
      .replace(/[\u064B-\u0652\u0670\u0640]/g,"")
      .replace(/\s+/g," ")
      .trim();
  }

  function showAnswer(parent, answer, correct, status, points){

    const item = document.createElement("div");

    item.style.padding = "12px";
    item.style.margin = "8px 0";
    item.style.borderRadius = "8px";
    item.style.overflowWrap = "anywhere";

    const colors = {
      correct: ["#e8f3e8","#287442","✓ إجابة صحيحة"],
      wrong: ["#fce8e8","#b42318","✗ إجابة خاطئة"],
      empty: ["#eeeeee","#666666","— لم تتم الإجابة"]
    };

    const c = colors[status];

    item.style.background = c[0];

    addText(item,c[2],c[1]).style.fontWeight = "bold";

    addText(item,"إجابة الطالبة: "+(answer || "لم تتم الإجابة"));

    addText(item,"الإجابة النموذجية: "+correct);

    addText(item,"الدرجة: "+points);

    parent.appendChild(item);
  }

  try{

    const {data,error} = await db.rpc(
      "get_result_details",
      {p_result_id:resultId}
    );

    if(error) throw error;

    panel.replaceChildren();

    addText(panel,"تفاصيل إجابات: "+data.student_name)
      .style.fontWeight = "bold";

    addText(panel,"الدرجة المسجلة: "+data.score+" من "+data.total);

    let calculatedScore = 0;
    let calculatedTotal = 0;

    data.questions.forEach((q,i)=>{

      calculatedScore += q.earned_points;
      calculatedTotal += q.total_points;

      const section = document.createElement("div");

      section.style.borderTop = "1px solid #d8c5a4";
      section.style.paddingTop = "12px";
      section.style.marginTop = "15px";

      addText(
        section,
        "السؤال "+(i+1)+": "+
        q.question.replace(/\[blank\]/g,"........")
      ).style.fontWeight = "bold";

      if(q.question_type === "multiple_choice"){

        const empty = q.student_answer == null;

        const correct = !empty &&
          q.student_answer === q.correct_answer;

        const answer = empty
          ? ""
          : q.options[q.student_answer];

        showAnswer(
          section,
          answer,
          q.options[q.correct_answer],
          empty ? "empty" : correct ? "correct" : "wrong",
          q.earned_points+" من "+q.total_points
        );

      }else{

        const answers = Array.isArray(q.student_answer)
          ? q.student_answer
          : [];

        q.correct_text_answers.forEach((correct,j)=>{

          const answer = answers[j] ?? "";

          const empty = normalizeAnswer(answer) === "";

          const valid = !empty &&
            normalizeAnswer(answer) === normalizeAnswer(correct);

          addText(section,"الفراغ رقم "+(j+1))
            .style.fontWeight = "bold";

          showAnswer(
            section,
            answer,
            correct,
            empty ? "empty" : valid ? "correct" : "wrong",
            (valid ? q.points : 0)+" من "+q.points
          );

        });

      }

      addText(
        section,
        "مجموع درجة السؤال: "+
        q.earned_points+" من "+q.total_points
      ).style.fontWeight = "bold";

      panel.appendChild(section);

    });

    if(calculatedScore !== data.score ||
       calculatedTotal !== data.total){

      addText(
        panel,
        "تنبيه: تفاصيل التصحيح الحالية تختلف عن النتيجة الأصلية المسجلة.",
        "#b42318"
      );

    }

    const close = document.createElement("button");

    close.type = "button";
    close.textContent = "إخفاء تفاصيل الإجابات";
    close.style.background = "#8e7955";
    close.onclick = ()=>panel.remove();

    panel.appendChild(close);

  }catch(error){

    panel.textContent = error.message ||
      "تعذر تحميل تفاصيل الإجابات";

  }

}
</script>

      (!target || target.hidden)) {
    alert("اختاري الاختبار أولاً ثم اضغطي على إدارة الأسئلة");
    target = document.getElementById("exams");
  }

  if (target) {

    });

}
</script>
